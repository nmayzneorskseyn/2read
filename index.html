Если вы изучаете английский или любой другой предмет, чёткие цели для каждого занятия помогают не сбиваться с плана. Например, можно решить ежедневно читать новостную статью, писать краткое изложение или запоминать набор слов. Короткие перерывы во время занятий дают мозгу отдохнуть и улучшают концентрацию. Пробуйте разные варианты организации рабочего места, пока не найдёте подходящий, и помните, что благоприятная обстановка так же важна, как упорный труд.", "kk": "Үйдегі қолайлы оқу ортасы білім алудағы жетістікке айтарлықтай әсер етуі мүмкін. Оқу орнын ретке келтіріп, қатты шу немесе артық заттар сияқты алаңдататын нәрселерден арылу маңызды. Жақсы жарық, ыңғайлы орындық және қажет материалдардың қолжетімді жерде болуы ұзақ сабақтарды жеңіл әрі нәтижелі етеді. Кейбір адамдарға тыныштандыратын әшекейлер немесе музыка зейін қоюға көмектеседі.

 short breaks", "Studying without stopping for several hours", "Skipping meals", "Only studying at night", "Avoiding all rest"], "answer": 0, "explain": {"ru": "Короткие перерывы позволяют мозгу отдохнуть и улучшают концентрацию.", "kk": "Қысқа үзілістер миға демалуға мүмкіндік беріп, зейінді жақсартады."}}, {"q": "What should you keep within reach when studying for long periods?", "options": ["Cleaning supplies", "Snacks and TV remote", "All the materials you need", "Clothes and shoes", "Extra decorations"], "answer": 2, "explain": {"ru": "Необходимые учебные материалы должны быть под рукой.", "kk": "Қажетті оқу материалдары қолжетімді жерде болуы керек."}}, {"q": "What does the text suggest about finding your best study environment?", "options": ["Study only in crowded areas", "Stick to the first method you try", "Experiment with different setups until you find what works", "Always copy how others study", "Change your setup every hour"], "answer": 2, "explain": {"ru": "Автор советует пробовать разные способы организации пространства, чтобы найти подходящий.", "kk": "Автор өзіңізге қолайлы нұсқаны тапқанша оқу орнын әртүрлі ұйымдастырып көруге кеңес береді."}}, {"q": "Which task is given as an example of a clear study goal?", "options": ["Memorizing a set of words", "Rearranging the whole house", "Watching television for an hour", "Calling friends during class", "Buying a new desk every week"], "answer": 0, "explain": {"ru": "Запоминание набора слов — один из примеров конкретной учебной цели.", "kk": "Бірнеше сөзді жаттау — нақты оқу мақсатының мысалы."}}, {"q": "What does the author say is as important as hard work?", "options": ["A positive study environment", "Having the newest laptop", "Studying with a large group", "Never taking breaks", "Using many decorations"], "answer": 0, "explain": {"ru": "В заключении говорится, что благоприятная обстановка так же важна, как усердная работа.", "kk": "Қорытындыда қолайлы орта табанды еңбек сияқты маңызды делінген."}}], "synonyms": [["productive", "effective", "продуктивный", "нәтижелі"], ["distractions", "interruptions", "отвлекающие факторы", "алаңдататын нәрселер"], ["concentrate", "focus", "сосредоточиться", "зейін қою"], ["clutter", "mess", "беспорядок", "ретсіздік"], ["environment", "surroundings", "обстановка", "орта"]], "paraphrases": [["have a big impact", "strongly influence", "оказывать большое влияние", "айтарлықтай әсер ету"], ["free from distractions", "without things that interrupt attention", "без отвлекающих факторов", "алаңдататын нәрселерсіз"], ["within reach", "close enough to use easily", "под рукой", "қолжетімді жерде"], ["stay on track", "follow the planned course", "придерживаться плана", "жоспарды ұстану"], ["experiment with different setups", "try various arrangements", "пробовать разные варианты организации", "әртүрлі ұйымдастыру тәсілін сынау"]]}, {"title": "Blue Whales: The Journey of a Lifetime", "level": "A2–B1", "text": "Have you ever wanted to see a whale close up? Blue whales are the largest mammals on Earth, weighing up to 200 tons. They can grow up to 88 feet in length—larger than a jumbo jet!

Their migrations are some of the most fascinating in the world. Blue whales leave their feeding grounds and travel thousands of miles to warmer waters. During their journey, they may travel along the west coast of North America. They spend the summer feeding in colder northern waters and move south as the seasons change. When they reach warmer waters, they may give birth to calves.

Blue whales can be found in oceans around the globe, including the North Atlantic and North Pacific. Their journey is long, and these giant animals depend on the ocean for food and safety. They mainly eat tiny animals called krill.

If you ever have the chance to see whales for yourself, watch for their blowholes just before they emerge from the water for graceful dives and playful flips. Look for an eruption of water straight up into the air. Once you see that, it is only a few moments before you see this majestic creature emerge.", "translation": {"ru": "Вы когда-нибудь хотели увидеть кита вблизи? Синие киты — крупнейшие млекопитающие на Земле, их вес может достигать 200 тонн. Они вырастают до 88 футов в длину — это больше, чем длина большого пассажирского самолёта!

Их миграции — одни из самых удивительных в мире. Синие киты покидают места кормления и преодолевают тысячи миль, направляясь в более тёплые воды. Во время путешествия они могут двигаться вдоль западного побережья Северной Америки. Летом они кормятся в холодных северных водах, а со сменой сезонов перемещаются на юг. В тёплых водах у них могут рождаться детёныши.

Синие киты встречаются в океанах по всему миру, включая северную часть Атлантического и Тихого океанов. Их путь долог, и эти огромные животные зависят от океана, который даёт им пищу и защиту. В основном они питаются крошечными животными — крилем.

Если вам представится возможность увидеть китов, следите за их дыхательными отверстиями перед тем, как они покажутся из воды. Обратите внимание на фонтан воды, поднимающийся вертикально вверх. После этого пройдёт всего несколько мгновений, прежде чем появится величественное животное.", "kk": "Сіз китті жақыннан көргіңіз келді ме? Көк киттер — Жер бетіндегі ең ірі сүтқоректілер. Олардың салмағы 200 тоннаға дейін жетеді. Ұзындығы 88 футқа дейін өседі, бұл үлкен жолаушылар ұшағынан да ұзын!

Олардың қоныс аударуы әлемдегі ең қызықты құбылыстардың бірі. Көк киттер қоректенетін жерлерінен шығып, жылы суға жету үшін мыңдаған миль жүреді. Сапар барысында Солтүстік Американың батыс жағалауымен жүзе алады. Жазда солтүстіктегі суық суларда қоректеніп, жыл мезгілі ауысқанда оңтүстікке көшеді. Жылы суларда олардың балалары дүниеге келуі мүмкін.

Көк киттер дүниежүзіндегі мұхиттарда, соның ішінде Солтүстік Атлант пен Солтүстік Тынық мұхитында кездеседі. Олардың жолы ұзақ, ал бұл алып жануарлар қорек пен қауіпсіздік үшін мұхитқа тәуелді. Негізінен криль деп аталатын өте ұсақ жануарлармен қоректенеді.

Егер киттерді өз көзіңізбен көру мүмкіндігі туса, олардың су бетіне шығар алдындағы тыныс алу тесігіне назар аударыңыз. Тік жоғары атқылаған су бұрқағын іздеңіз. Одан кейін бірнеше сәт ішінде осы айбынды жануар су бетіне шығады."}, "questions": [{"q": "What is the maximum length of a blue whale mentioned in the text?", "options": ["15 feet", "88 feet", "120 feet", "62 feet", "200 feet"], "answer": 1, "explain": {"ru": "В тексте указана длина до 88 футов; 200 относится к массе в тоннах.", "kk": "Мәтінде ұзындығы 88 футқа дейін жететіні айтылған; 200 — тоннамен берілген салмақ."}}, {"q": "In which ocean can you find blue whales?", "options": ["Indian Ocean", "North Pacific Ocean", "Arctic Ocean only", "Colorado River", "A mountain lake"], "answer": 1, "explain": {"ru": "В тексте прямо упоминается северная часть Тихого океана.", "kk": "Мәтінде Солтүстік Тынық мұхиты нақты аталған."}}, {"q": "Why do blue whales migrate to warmer waters?", "options": ["To find a city", "To escape all other whales", "To give birth to calves", "To search for trees", "To climb onto beaches"], "answer": 2, "explain": {"ru": "Тёплые воды связаны с появлением детёнышей — calves.", "kk": "Жылы суларға көшуі төлдерінің дүниеге келуімен байланысты."}}, {"q": "What are baby whales called?", "options": ["Calves", "Babies", "Kittens", "Pups", "Chicks"], "answer": 0, "explain": {"ru": "Детёнышей китов по-английски называют calves.", "kk": "Киттің төлдері ағылшынша calves деп аталады."}}, {"q": "How long can a whale migration be?", "options": ["A few meters", "Thousands of miles", "One city block", "A few steps", "One swimming pool"], "answer": 1, "explain": {"ru": "Автор подчёркивает, что киты проплывают тысячи миль.", "kk": "Автор киттердің мыңдаған миль жүзетінін атап өтеді."}}, {"q": "What do blue whales mainly eat?", "options": ["Large fish", "Sharks", "Sea birds", "Krill", "Seaweed"], "answer": 3, "explain": {"ru": "В тексте назван криль — крошечные морские животные.", "kk": "Мәтінде негізгі қорегі криль деп аталатын ұсақ теңіз жануарлары екені жазылған."}}, {"q": "Which coast of North America is mentioned in the text?", "options": ["East coast", "West coast", "Gulf coast", "Arctic coast", "Southern coast of Mexico"], "answer": 1, "explain": {"ru": "Путь китов описан вдоль западного побережья Северной Америки.", "kk": "Киттердің жолы Солтүстік Американың батыс жағалауы бойымен сипатталған."}}, {"q": "What can help you spot a whale before it surfaces?", "options": ["A splash made by a boat", "A bright light underwater", "An eruption of water into the air", "A flock of birds on a tree", "A change in the color of sand"], "answer": 2, "explain": {"ru": "Фонтан воды над дыхательным отверстием — признак скорого появления кита.", "kk": "Тыныс алу тесігінен жоғары атқылаған су киттің жақында шығатынын білдіреді."}}], "synonyms": [["fascinating", "captivating", "увлекательный", "қызықты"], ["majestic", "magnificent", "величественный", "айбынды"], ["migrate", "travel seasonally", "мигрировать", "қоныс аудару"], ["emerge", "come out", "появляться", "көріну"], ["tiny", "very small", "крошечный", "өте кішкентай"]], "paraphrases": [["the largest mammals on Earth", "the biggest mammal species in the world", "крупнейшие млекопитающие на Земле", "Жердегі ең ірі сүтқоректілер"], ["travel thousands of miles", "cover extremely long distances", "преодолевать тысячи миль", "мыңдаған миль жүру"], ["warmer waters", "seas with higher temperatures", "более тёплые воды", "жылырақ сулар"], ["around the globe", "throughout the world", "по всему миру", "бүкіл әлем бойынша"], ["a few moments before", "shortly before", "за несколько мгновений до", "бірнеше сәт бұрын"]]}, {"title": "Pluto", "level": "A2–B1", "text": "Pluto is an interesting \"planet\" because it is actually not considered a planet anymore. It's a large object orbiting the Sun—the tenth largest that we know of—but astronomers changed its classification to dwarf planet when better telescopes improved their ability to see far-away objects.

Pluto was discovered in 1930 and from then on became one of the nine planets all schoolchildren learned. It was the farthest out of the nine planets (light from the Sun takes five hours to reach Pluto), so not much was known about it at first. As bigger and better telescopes became available, astronomers discovered that it is made of ice and rock and is about one-sixth the mass of the Moon.

In the 1990s, astronomers made another discovery about Pluto. It was but one of several objects orbiting the Sun in an area called the Kuiper belt. One of these objects, Eris, was even larger than Pluto. In 2006, the International Astronomical Union formally defined the term planet and excluded Pluto. Pluto and Eris are now known as dwarf planets.", "translation": {"ru": "Плутон — интересная «планета», потому что сегодня он уже не считается обычной планетой. Это крупный объект, вращающийся вокруг Солнца, — десятый по величине среди известных нам подобных объектов. Однако астрономы изменили его классификацию на карликовую планету, когда более совершенные телескопы позволили лучше наблюдать далёкие небесные тела.

Плутон был открыт в 1930 году, после чего стал одной из девяти планет, о которых учили в школе. Он находился дальше всего от Солнца среди этих девяти планет: солнечному свету требуется пять часов, чтобы добраться до него. Поэтому сначала о Плутоне знали немного. С появлением более мощных телескопов астрономы выяснили, что он состоит из льда и камня, а его масса составляет примерно одну шестую массы Луны.

В 1990-х годах астрономы сделали ещё одно открытие: Плутон оказался одним из нескольких объектов, обращающихся вокруг Солнца в области, называемой поясом Койпера. Один из таких объектов, Эрида, был даже крупнее Плутона. В 2006 году Международный астрономический союз официально определил понятие «планета» и исключил Плутон из этой категории. Теперь Плутон и Эрида известны как карликовые планеты.", "kk": "Плутон — қызықты «ғаламшар», себебі қазір ол кәдімгі ғаламшар болып саналмайды. Ол Күнді айналатын үлкен аспан денесі, біз білетін осындай нысандардың ішіндегі көлемі бойынша оныншы. Алайда қуатты телескоптар алыстағы денелерді жақсырақ бақылауға мүмкіндік бергенде, астрономдар оның санатын ергежейлі ғаламшар деп өзгертті.

Плутон 1930 жылы ашылды. Содан кейін ол мектеп оқушылары оқитын тоғыз ғаламшардың бірі болды. Ол осы тоғыз ғаламшардың ішіндегі Күннен ең алысы еді: Күн сәулесі Плутонға бес сағатта жетеді. Сондықтан бастапқыда ол туралы көп нәрсе белгісіз болды. Үлкен әрі жақсы телескоптар пайда болғанда, астрономдар оның мұз бен тастан тұратынын және массасы Ай массасының шамамен алтыдан біріне тең екенін анықтады.

Растения прекрасно приспосабливаются даже к сложным условиям — и к жаре, и к холоду. Они производят собственную пищу благодаря солнечному свету, поглощают питательные вещества из земли и привлекают насекомых для переноса пыльцы. Это действительно одни из прекраснейших творений природы."}, "vocab": [["extraordinary", "remarkable / exceptional", "ерекше", "необыкновенный"], ["complicated", "complex / intricate", "күрделі", "сложный"], ["distribute", "spread / disperse", "тарату", "распространять"], ["adaptable", "flexible / resilient", "бейімделгіш", "приспособляемый"], ["manufacture", "produce / make", "өндіру", "производить"], ["nutrients", "nourishing substances", "қоректік заттар", "питательные вещества"]], "paraphrases": [["Plants are extraordinary living things.", "Plants are remarkable organisms."], ["A whole new plant can be grown from just a single leaf.", "One leaf may develop into an entirely new plant."], ["Plants distribute their seeds.", "Plants spread their seeds to new places."], ["Plants are amazingly adaptable.", "Plants can adjust to many different conditions."], ["Plants manufacture their own food from sunlight.", "Plants use sunlight to produce their own nourishment."]]}, {"title": "Making Quantum Computers Reliable", "level": "B2", "text": "Quantum computers are powerful in theory but fragile in practice. Qubits lose their delicate quantum state through noise, a problem called decoherence. Error correction is the strategy to protect information by spreading one “logical” qubit across many “physical” qubits. The leading method, the surface code, arranges qubits on a grid and repeatedly checks patterns, called syndromes, that reveal errors without disturbing the data. If the hardware error rates are below a threshold, increasing the code’s size should make logical errors exponentially rarer. Superconducting circuits, trapped ions, and neutral atoms each offer trade-offs among speed, connectivity, and coherence, which affect how well the surface code can run.

ubits randomly and fixes faults by resetting them", "It uses all-to-all links to correct errors with global parity reads", "It strings qubits in a line and measures data directly each cycle", "It arranges qubits on a grid and checks syndrome patterns for errors"], 3, "Surface codes use a grid and repeated syndrome checks.", "Surface code кубиттерді торға орналастырып, синдром үлгілерін тексереді.", "Поверхностный код размещает кубиты на сетке и проверяет синдромы ошибок."], ["What happens when hardware error rates are below threshold?", ["Below threshold, larger codes make logical errors exponentially rarer", "Adding qubits makes decoherence faster but logic perfect", "Larger codes make logical errors increase linearly with size", "Hardware errors vanish completely regardless of code size"], 0, "The passage states that increasing code size reduces logical errors exponentially below threshold.", "Шекті деңгейден төмен болса, код көлемін арттыру логикалық қателерді күрт азайтады.", "Ниже порога увеличение кода экспоненциально уменьшает логические ошибки."], ["What milestone have recent experiments suggested?", ["Tiny codes always outperform larger ones regardless of hardware", "Scaling codes offers no benefit to logical error suppression", "Bigger codes already guarantee perfect error-free fault tolerance", "Larger quantum codes can begin to outperform smaller ones"], 3, "Recent experiments show early signs of larger codes doing better.", "Тәжірибелер үлкен кодтардың кіші кодтардан жақсы жұмыс істей алатынын көрсетті.", "Эксперименты показали первые признаки преимущества больших кодов."], ["Why is scaling to useful algorithms so demanding?", ["One logical qubit may need hundreds or thousands of physical qubits, and many are needed", "Useful algorithms require only a few logical qubits to run", "Dozens of physical qubits per chip are enough for full correction", "One physical qubit can host thousands of logical qubits with ease"], 0, "A logical qubit is costly, and useful tasks may need thousands of them.", "Бір логикалық кубитке жүздеген не мыңдаған физикалық кубит қажет болуы мүмкін.", "Один логический кубит может требовать сотни или тысячи физических кубитов."], ["What is error mitigation used for today?", ["Eliminating all errors to achieve full fault tolerance now", "Replacing error correction entirely in large-scale processors", "Reducing noise in small devices for more reliable simulations and tests", "Speeding gates beyond hardware limits by overclocking qubits"], 2, "Mitigation makes small-device results more reliable without full correction.", "Қателерді азайту шағын құрылғылардағы нәтижелерді сенімдірек етеді, бірақ толық түзету емес.", "Смягчение ошибок повышает надёжность результатов небольших устройств, но не заменяет полную коррекцию."], ["What does the current roadmap prioritize?", ["Room-temperature qubits that eliminate cryogenic engineering", "Bigger monolithic chips without optical links or modularity", "Only software compilers, while ignoring hardware and measurement advances", "Faster, cleaner two-qubit gates, better measurement, and modular photonic links"], 3, "The final paragraph names gates, measurements and modular photonic architectures.", "Соңғы абзацта сапалы екі кубиттік қақпалар, өлшеу және фотондық байланыстар аталған.", "В конце названы более качественные двухкубитные операции, измерения и фотонные связи."]], "translation": {"kk": "Кванттық компьютерлер теория жүзінде өте қуатты, бірақ іс жүзінде нәзік. Кубиттер шу әсерінен кванттық күйін жоғалтады; бұл құбылыс декогеренция деп аталады. Ақпаратты қорғау үшін қателерді түзету қолданылады: бір «логикалық» кубиттің ақпараты көптеген «физикалық» кубитке таратылады. Кең таралған surface code әдісі кубиттерді тор түрінде орналастырып, деректерді бұзбай қателерді көрсететін синдром үлгілерін қайта-қайта тексереді. Егер құрылғыдағы қате жиілігі белгілі шектен төмен болса, кодты үлкейту логикалық қателерді экспоненциалды түрде азайтуы тиіс. Асқынөткізгіш тізбектер, тұзақталған иондар және бейтарап атомдар жылдамдық, байланыс және кванттық күйдің сақталуы жағынан әртүрлі мүмкіндіктер ұсынады.

Соңғы тәжірибелер үлкен кодтар кіші кодтардан жақсырақ жұмыс істей алатынын көрсетті. Бұл ауқымды кванттық есептеуге маңызды қадам. Алайда бір сапалы логикалық кубитке жүздеген немесе мыңдаған физикалық кубит қажет болуы мүмкін, ал пайдалы алгоритмдер мыңдаған логикалық кубитті талап етуі ықтимал. Әзірге зерттеушілер шағын құрылғылардағы шуды азайту үшін қателерді бәсеңдету әдістерін пайдаланады. Бұл химиялық модельдеулер мен оңтайландыру сынақтарын сенімдірек етеді, бірақ толық қателерді түзету емес. Болашақ жоспар жылдамырақ әрі дәлірек екі кубиттік операцияларға, жақсы өлшеуге және шағын процессорларды фотондар арқылы байланыстыратын модульдік құрылымдарға бағытталған. Басқару электроникасы мен криогендік инженерия дамыған сайын, қателерге төзімді жүйелерге жол айқындала түседі. Мақсат — жай үлкен компьютер емес, нақты мәселелерді шешкенше нәтижелерінің дұрыстығын сақтайтын машина.", "ru": "Квантовые компьютеры очень мощны в теории, но уязвимы на практике. Из-за шума кубиты теряют своё тонкое квантовое состояние — это называется декогеренцией. Для защиты информации применяют коррекцию ошибок: один «логический» кубит кодируют с помощью множества «физических» кубитов. Ведущий подход, поверхностный код (surface code), размещает кубиты на сетке и многократно проверяет закономерности — синдромы, которые выявляют ошибки, не нарушая данные. Если частота аппаратных ошибок ниже определённого порога, увеличение размера кода должно экспоненциально снижать число логических ошибок. Сверхпроводящие схемы, захваченные ионы и нейтральные атомы имеют разные преимущества и ограничения по скорости, связности и сохранению квантового состояния.

Недавние эксперименты дали первые признаки того, что большие коды способны превосходить меньшие — важный шаг к масштабируемым квантовым вычислениям. Однако для одного качественного логического кубита могут понадобиться сотни или тысячи физических, а полезные алгоритмы могут потребовать тысячи логических кубитов. Пока такой масштаб недостижим, исследователи используют методы смягчения ошибок, чтобы уменьшать шум в небольших устройствах. Это повышает надёжность моделирования химических процессов и оптимизационных испытаний, хотя не обеспечивает полноценной коррекции. Дальнейшая работа сосредоточена на более быстрых и точных двухкубитных операциях, улучшенных измерениях и модульных архитектурах, соединяющих небольшие процессоры фотонными каналами. С развитием управляющей электроники и криогенной техники путь к отказоустойчивости становится яснее. Цель — не просто более крупная машина, а компьютер, который сохраняет достоверность ответов достаточно долго для решения реальных задач."}, "vocab": [["fragile", "delicate / vulnerable", "нәзік", "хрупкий"], ["decoherence", "loss of quantum coherence", "декогеренция", "декогеренция"], ["threshold", "limit / boundary", "шекті деңгей", "порог"], ["mitigation", "reduction / alleviation", "азайту", "смягчение"], ["scalable", "expandable / able to grow", "ауқымдалатын", "масштабируемый"], ["trustworthy", "reliable / dependable", "сенімді", "надёжный"]], "paraphrases": [["Qubits lose their delicate quantum state through noise.", "Noise can destroy the fragile state of a qubit."], ["Error correction protects information.", "Error-correcting methods help preserve quantum information."], ["Larger codes can outperform smaller ones.", "Increasing code size may improve logical-qubit performance."], ["Useful algorithms may need thousands of logical qubits.", "Practical computations could require many thousands of encoded qubits."], ["The roadmap focuses on faster, cleaner two-qubit gates.", "Researchers aim to improve the speed and accuracy of two-qubit operations."]]}];

function render(){const scrollPosition=window.scrollY;const t=UI[lang];document.getElementById('mainTitle').textContent=t.title;document.getElementById('subtitle').textContent=t.sub;document.getElementById('topicTitle').textContent=t.topic;const root=document.getElementById('lessons');root.replaceChildren();DATA.forEach((d,i)=>{if(i===3){const topic2=el('div','topic');topic2.append(el('h2','',lang==='ru'?'Тема 2. Научная работа, открытия, деятели науки и общества':'2-тақырып. Ғылыми жұмыс, жаңалықтар, ғылым және қоғам қайраткерлері'));root.append(topic2)}const sec=el('section','lesson');sec.id='reading-'+(i+1);sec.append(el('div','meta','READING '+String(i+1).padStart(2,'0')+' · '+d.level),el('h3','',d.title),el('div','original',d.text));const extras=el('div','extras');[[t.translation,'translation'],[t.synonyms,'synonyms'],[t.paraphrases,'paraphrases']].forEach(([name,type])=>{const dt=el('details');dt.append(el('summary','',name));const inside=el('div','inside');if(type==='translation')inside.append(el('div','translation',d.translation[lang]));else d[type].forEach(p=>{const r=el('div','pair');const first=el('b','',p[0]);r.append(first,el('span','', ' → '),el('em','',p[1]),el('small','',p[lang==='ru'?2:3]));inside.append(r)});dt.append(inside);extras.append(dt)});sec.append(extras);const head=el('div','quizhead');head.append(el('h4','',t.questions));const ms=el('div','modes');['quiz','test'].forEach(m=>{const b=el('button',modes[i]===m?'active':'',m==='quiz'?t.quiz:t.test);b.onclick=()=>{modes[i]=m;answers[i]=Array(8).fill(null);completed[i]=false;render()};ms.append(b)});head.append(ms);sec.append(head,el('p','muted',modes[i]==='quiz'?t.modeQuiz:t.modeTest));d.questions.forEach((q,j)=>{const block=el('div','q');block.append(el('strong','',(j+1)+'. '+q.q));q.options.forEach((opt,k)=>{const label=el('label','option');const inp=el('input');inp.type='radio';inp.name='q-'+i+'-'+j;inp.checked=answers[i][j]===k;inp.disabled=completed[i]||(modes[i]==='quiz'&&answers[i][j]!==null);inp.onchange=()=>{answers[i][j]=k;render()};label.append(inp,el('span','',String.fromCharCode(65+k)+') '+opt));block.append(label)});if(answers[i][j]!==null&&(modes[i]==='quiz'||completed[i])){const ok=answers[i][j]===q.answer;const fb=el('div','feedback '+(ok?'ok':'bad'));fb.append(el('b','',ok?t.right:t.wrong),el('div','',t.correct+': '+String.fromCharCode(65+q.answer)+') '+q.options[q.answer]),el('div','',t.explanation+': '+q.explain[lang]));block.append(fb)}sec.append(block)});const actions=el('div','actions');if(modes[i]==='test'&&!completed[i]){const finish=el('button','finish',t.check);finish.onclick=()=>{if(answers[i].some(a=>a===null)){alert(t.unanswered);return}completed[i]=true;render()};actions.append(finish)}const reset=el('button','reset',t.reset);reset.onclick=()=>{answers[i]=Array(8).fill(null);completed[i]=false;render()};actions.append(reset);sec.append(actions);if(completed[i]||(modes[i]==='quiz'&&answers[i].every(a=>a!==null))){const score=d.questions.reduce((s,q,j)=>s+(answers[i][j]===q.answer?1:0),0);sec.append(el('div','result',t.score+': '+score+' / 8'))}root.append(sec)});window.scrollTo(0,scrollPosition)}
