<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGIST PRO — Reading Part 2</title><style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1b2845;background:#f7f8fe}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dfe3f4;position:sticky;top:0;z-index:3}nav{max-width:1050px;margin:auto;padding:20px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:900}.brand b{color:#5044f4}.switch{display:flex;background:#eeedff;border-radius:30px;padding:4px}.switch button{border:0;background:none;padding:9px 16px;border-radius:25px;font-weight:800;cursor:pointer;color:#26304d}.switch button.active{background:#5044f4;color:white}main{max-width:1050px;margin:34px auto;padding:0 16px}.eyebrow{font-weight:900;letter-spacing:.12em;color:#5044f4;font-size:12px}h1{font-size:clamp(26px,4vw,42px);margin:12px 0}.sub{color:#68738e;margin-bottom:28px}.lesson{background:#fff;border:1px solid #dce2f5;border-radius:20px;padding:28px;margin:25px 0;box-shadow:0 8px 35px #20255a0a}.num{font-weight:900;color:#5044f4;font-size:12px;letter-spacing:.08em}.lesson h2{font-size:26px;margin:10px 0}.topic{color:#64718a}.original{white-space:pre-line;line-height:1.85;font-size:16px;background:#f6f7ff;border:1px solid #e3e6f6;border-radius:14px;padding:20px;margin:20px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button,.mode button,.check{border:1px solid #dfe2f5;border-radius:11px;padding:12px 16px;background:white;color:#24304e;font-weight:750;cursor:pointer}.tabs button.active,.mode button.active,.check{background:#5145ef;color:white;border-color:#5145ef}.panel{display:none}.panel.active{display:block}.mode{display:flex;align-items:center;gap:8px;margin:12px 0 18px;flex-wrap:wrap}.question{border:1px solid #e0e5f4;border-radius:14px;padding:17px;margin:12px 0}.question h3{font-size:16px;margin:0 0 14px}.choice{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;margin:5px 0;border:1px solid #e8eaf4;border-radius:9px;cursor:pointer}.choice:has(input:checked){border-color:#5044f4;background:#f4f2ff}.explain{margin-top:10px;padding:13px;border-radius:9px;background:#eef7f3;color:#245542;line-height:1.55}.wrong{background:#fff1f1;color:#833030}.muted{color:#68738e}.translation{white-space:pre-line;line-height:1.85}.smallcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.smallcard{background:#f8f9ff;border:1px solid #e0e4f3;border-radius:12px;padding:15px;line-height:1.6}.smallcard strong{color:#5044f4}.smallcard em{display:block;color:#5e6881;font-style:normal}.result{font-size:19px;font-weight:800;margin:14px 0}@media(max-width:600px){.lesson{padding:16px}nav{padding:15px}.original{padding:14px}.tabs button{flex:1 1 42%}}</style></head><body><header><nav><div class="brand">MAGIST <b>PRO</b></div><div class="switch"><button id="kk" class="active" onclick="setLang('kk')">ҚАЗ</button><button id="ru" onclick="setLang('ru')">РУС</button></div></nav></header><main><div class="eyebrow">ENGLISH · READING · PART 2</div><h1 id="heading"></h1><p class="sub" id="subtitle"></p><div id="lessons"></div></main><script>const DATA=[{"title": "Plants", "level": "B1", "text": "Plants are extraordinary living things. Although they seem simple, they are actually, in some ways, more complicated than us.\n\nFor instance, a whole new plant can be grown from just a single leaf. No animal can accomplish that! The way that plants distribute their seeds is amazing too. Plants can shoot seeds from their pods, send them flying on the wind, or grow spines that attach seeds to animals’ fur, spreading new generations everywhere.\n\nPlants are also amazingly adaptable, finding ways to grow even in impossible environments, both hot and cold. Plants manufacture their own food from sunlight, absorb nutrients from the ground, and fool insects into spreading their pollen. Truly, they are some of nature’s finest creations.", "questions": [["Plants are ___ because they can grow in many environments.", ["Adaptable", "Predictable", "Easy", "Despicable"], 0, "The text says plants grow even in very hot and cold environments.", "Мәтінде өсімдіктер ыстық және суық ортада да өсе алатыны айтылған.", "В тексте говорится, что растения растут даже в жарких и холодных условиях."], ["A single leaf can ___.", ["Fly on the wind", "Grow into a whole new plant", "Spread pollen", "Explode"], 1, "A whole plant can grow from one leaf.", "Бір жапырақтан тұтас өсімдік өсіп шығуы мүмкін.", "Из одного листа может вырасти целое растение."], ["Although plants seem simple, they are really ___.", ["Concrete", "Complicated", "Impossible", "Feisty"], 1, "The first paragraph describes plants as more complicated than they seem.", "Бірінші абзацта өсімдіктердің көрінгеннен күрделірек екені айтылған.", "В первом абзаце сказано, что растения сложнее, чем кажутся."], ["Plants can spread their seeds by ___.", ["Mailing them", "Destroying them", "Attaching them to animals’ fur", "Using insects as food"], 2, "Spines can attach seeds to animal fur.", "Тікенектер тұқымды жануарлардың жүніне жабыстыра алады.", "Колючки помогают семенам прикрепляться к шерсти животных."], ["How do plants manufacture their own food?", ["From water alone", "From sunlight", "From other plants", "From the kitchen"], 1, "The passage directly says plants make their food from sunlight.", "Мәтінде өсімдіктер қорегін күн сәулесінен жасайтыны көрсетілген.", "В тексте прямо сказано, что растения производят пищу благодаря солнечному свету."], ["What do plants absorb from the ground?", ["Nutrients", "Moonlight", "Animal fur", "Clouds"], 0, "Plants absorb nutrients from the ground.", "Өсімдіктер топырақтан қоректік заттарды сіңіреді.", "Растения поглощают питательные вещества из почвы."], ["How can plants use insects?", ["To carry their pollen", "To create sunlight", "To make cold weather", "To build their roots"], 0, "The passage explains that insects can help spread pollen.", "Жәндіктер тозаңның таралуына көмектеседі.", "Насекомые помогают переносить пыльцу."], ["Which statement best summarizes the passage?", ["Plants have several remarkable ways to survive and reproduce", "Plants grow in cold places but not hot places", "All plants reproduce in exactly the same way", "Plants depend on animals for all their food"], 0, "The text focuses on reproduction, adaptation and making food.", "Мәтін көбею, бейімделу және қорек өндіру туралы.", "Текст посвящён размножению, приспособлению и производству пищи."]], "translation": {"kk": "Өсімдіктер — ерекше тірі ағзалар. Олар қарапайым болып көрінгенімен, кейбір жағынан бізден де күрделі.\n\nМысалы, бір ғана жапырақтан жаңа өсімдік өсіп шығуы мүмкін. Мұны ешбір жануар жасай алмайды! Өсімдіктердің тұқым тарату жолдары да таңғаларлық: олар тұқымдарын қауашақтарынан шашады, желмен ұшырады немесе жануарлардың жүніне жабысатын тікенектер өсіреді. Осылайша жаңа өсімдіктер әр жерге таралады.\n\nӨсімдіктер өте бейімделгіш: олар ыстықта да, суықта да өсу жолын табады. Олар күн сәулесінен өз қорегін өндіреді, топырақтан қоректік заттарды сіңіреді және жәндіктерді тозаң таратуға пайдаланады. Шынында да, өсімдіктер — табиғаттың тамаша туындылары.", "ru": "Растения — удивительные живые организмы. Хотя они кажутся простыми, в некоторых отношениях они сложнее нас.\n\nНапример, из одного листа может вырасти целое новое растение. Ни одно животное не способно на такое! Способы распространения семян тоже удивительны: растения выбрасывают семена из коробочек, отправляют их по ветру или выращивают колючки, благодаря которым семена цепляются за шерсть животных и распространяются повсюду.\n\nРастения прекрасно приспосабливаются даже к сложным условиям — и к жаре, и к холоду. Они производят собственную пищу благодаря солнечному свету, поглощают питательные вещества из земли и привлекают насекомых для переноса пыльцы. Это действительно одни из прекраснейших творений природы."}, "vocab": [["extraordinary", "remarkable / exceptional", "ерекше", "необыкновенный"], ["complicated", "complex / intricate", "күрделі", "сложный"], ["distribute", "spread / disperse", "тарату", "распространять"], ["adaptable", "flexible / resilient", "бейімделгіш", "приспособляемый"], ["manufacture", "produce / make", "өндіру", "производить"], ["nutrients", "nourishing substances", "қоректік заттар", "питательные вещества"]], "paraphrases": [["Plants are extraordinary living things.", "Plants are remarkable organisms."], ["A whole new plant can be grown from just a single leaf.", "One leaf may develop into an entirely new plant."], ["Plants distribute their seeds.", "Plants spread their seeds to new places."], ["Plants are amazingly adaptable.", "Plants can adjust to many different conditions."], ["Plants manufacture their own food from sunlight.", "Plants use sunlight to produce their own nourishment."]]}, {"title": "Making Quantum Computers Reliable", "level": "B2", "text": "Quantum computers are powerful in theory but fragile in practice. Qubits lose their delicate quantum state through noise, a problem called decoherence. Error correction is the strategy to protect information by spreading one “logical” qubit across many “physical” qubits. The leading method, the surface code, arranges qubits on a grid and repeatedly checks patterns, called syndromes, that reveal errors without disturbing the data. If the hardware error rates are below a threshold, increasing the code’s size should make logical errors exponentially rarer. Superconducting circuits, trapped ions, and neutral atoms each offer trade-offs among speed, connectivity, and coherence, which affect how well the surface code can run.\n\nRecent experiments have shown the first hints that larger codes can outperform smaller ones, a key step toward scalable quantum computing. However, building a single high-quality logical qubit can require hundreds or thousands of physical qubits, and useful algorithms may need thousands of logical qubits. Until that scale is reached, researchers use error mitigation to reduce noise in small devices, enabling chemistry simulations and optimization tests that are more reliable, though not fully corrected. The roadmap now focuses on faster, cleaner two-qubit gates, better measurement, and modular architectures that link smaller processors with photonics. As control electronics improve and cryogenic engineering matures, the path to fault tolerance becomes clearer. The destination is not only a bigger machine, but one that keeps its answers trustworthy long enough to solve real problems.", "questions": [["What is decoherence in quantum computers?", ["A classical bits flipping from voltage drift in CPUs", "Spins aligning to a magnetic field to preserve data", "Qubits heating until they stabilize in a perfect state", "Qubits losing their delicate quantum state due to noise"], 3, "Decoherence is the loss of a quantum state caused by noise.", "Декогеренция — шудың әсерінен кванттық күйдің жоғалуы.", "Декогеренция — потеря квантового состояния из-за шума."], ["How does quantum error correction protect information?", ["By repeating runs and averaging results without encoding", "By spreading one logical qubit across many physical qubits", "By compressing many logical qubits into one physical qubit", "By isolating a single qubit from all interactions entirely"], 1, "The text defines error correction as encoding one logical qubit across physical qubits.", "Қателерді түзету бір логикалық кубитті бірнеше физикалық кубитке таратады.", "Коррекция ошибок распределяет один логический кубит между многими физическими."], ["What does the surface code do to detect errors?", ["It clusters qubits randomly and fixes faults by resetting them", "It uses all-to-all links to correct errors with global parity reads", "It strings qubits in a line and measures data directly each cycle", "It arranges qubits on a grid and checks syndrome patterns for errors"], 3, "Surface codes use a grid and repeated syndrome checks.", "Surface code кубиттерді торға орналастырып, синдром үлгілерін тексереді.", "Поверхностный код размещает кубиты на сетке и проверяет синдромы ошибок."], ["What happens when hardware error rates are below threshold?", ["Below threshold, larger codes make logical errors exponentially rarer", "Adding qubits makes decoherence faster but logic perfect", "Larger codes make logical errors increase linearly with size", "Hardware errors vanish completely regardless of code size"], 0, "The passage states that increasing code size reduces logical errors exponentially below threshold.", "Шекті деңгейден төмен болса, код көлемін арттыру логикалық қателерді күрт азайтады.", "Ниже порога увеличение кода экспоненциально уменьшает логические ошибки."], ["What milestone have recent experiments suggested?", ["Tiny codes always outperform larger ones regardless of hardware", "Scaling codes offers no benefit to logical error suppression", "Bigger codes already guarantee perfect error-free fault tolerance", "Larger quantum codes can begin to outperform smaller ones"], 3, "Recent experiments show early signs of larger codes doing better.", "Тәжірибелер үлкен кодтардың кіші кодтардан жақсы жұмыс істей алатынын көрсетті.", "Эксперименты показали первые признаки преимущества больших кодов."], ["Why is scaling to useful algorithms so demanding?", ["One logical qubit may need hundreds or thousands of physical qubits, and many are needed", "Useful algorithms require only a few logical qubits to run", "Dozens of physical qubits per chip are enough for full correction", "One physical qubit can host thousands of logical qubits with ease"], 0, "A logical qubit is costly, and useful tasks may need thousands of them.", "Бір логикалық кубитке жүздеген не мыңдаған физикалық кубит қажет болуы мүмкін.", "Один логический кубит может требовать сотни или тысячи физических кубитов."], ["What is error mitigation used for today?", ["Eliminating all errors to achieve full fault tolerance now", "Replacing error correction entirely in large-scale processors", "Reducing noise in small devices for more reliable simulations and tests", "Speeding gates beyond hardware limits by overclocking qubits"], 2, "Mitigation makes small-device results more reliable without full correction.", "Қателерді азайту шағын құрылғылардағы нәтижелерді сенімдірек етеді, бірақ толық түзету емес.", "Смягчение ошибок повышает надёжность результатов небольших устройств, но не заменяет полную коррекцию."], ["What does the current roadmap prioritize?", ["Room-temperature qubits that eliminate cryogenic engineering", "Bigger monolithic chips without optical links or modularity", "Only software compilers, while ignoring hardware and measurement advances", "Faster, cleaner two-qubit gates, better measurement, and modular photonic links"], 3, "The final paragraph names gates, measurements and modular photonic architectures.", "Соңғы абзацта сапалы екі кубиттік қақпалар, өлшеу және фотондық байланыстар аталған.", "В конце названы более качественные двухкубитные операции, измерения и фотонные связи."]], "translation": {"kk": "Кванттық компьютерлер теория жүзінде өте қуатты, бірақ іс жүзінде нәзік. Кубиттер шу әсерінен кванттық күйін жоғалтады; бұл құбылыс декогеренция деп аталады. Ақпаратты қорғау үшін қателерді түзету қолданылады: бір «логикалық» кубиттің ақпараты көптеген «физикалық» кубитке таратылады. Кең таралған surface code әдісі кубиттерді тор түрінде орналастырып, деректерді бұзбай қателерді көрсететін синдром үлгілерін қайта-қайта тексереді. Егер құрылғыдағы қате жиілігі белгілі шектен төмен болса, кодты үлкейту логикалық қателерді экспоненциалды түрде азайтуы тиіс. Асқынөткізгіш тізбектер, тұзақталған иондар және бейтарап атомдар жылдамдық, байланыс және кванттық күйдің сақталуы жағынан әртүрлі мүмкіндіктер ұсынады.\n\nСоңғы тәжірибелер үлкен кодтар кіші кодтардан жақсырақ жұмыс істей алатынын көрсетті. Бұл ауқымды кванттық есептеуге маңызды қадам. Алайда бір сапалы логикалық кубитке жүздеген немесе мыңдаған физикалық кубит қажет болуы мүмкін, ал пайдалы алгоритмдер мыңдаған логикалық кубитті талап етуі ықтимал. Әзірге зерттеушілер шағын құрылғылардағы шуды азайту үшін қателерді бәсеңдету әдістерін пайдаланады. Бұл химиялық модельдеулер мен оңтайландыру сынақтарын сенімдірек етеді, бірақ толық қателерді түзету емес. Болашақ жоспар жылдамырақ әрі дәлірек екі кубиттік операцияларға, жақсы өлшеуге және шағын процессорларды фотондар арқылы байланыстыратын модульдік құрылымдарға бағытталған. Басқару электроникасы мен криогендік инженерия дамыған сайын, қателерге төзімді жүйелерге жол айқындала түседі. Мақсат — жай үлкен компьютер емес, нақты мәселелерді шешкенше нәтижелерінің дұрыстығын сақтайтын машина.", "ru": "Квантовые компьютеры очень мощны в теории, но уязвимы на практике. Из-за шума кубиты теряют своё тонкое квантовое состояние — это называется декогеренцией. Для защиты информации применяют коррекцию ошибок: один «логический» кубит кодируют с помощью множества «физических» кубитов. Ведущий подход, поверхностный код (surface code), размещает кубиты на сетке и многократно проверяет закономерности — синдромы, которые выявляют ошибки, не нарушая данные. Если частота аппаратных ошибок ниже определённого порога, увеличение размера кода должно экспоненциально снижать число логических ошибок. Сверхпроводящие схемы, захваченные ионы и нейтральные атомы имеют разные преимущества и ограничения по скорости, связности и сохранению квантового состояния.\n\nНедавние эксперименты дали первые признаки того, что большие коды способны превосходить меньшие — важный шаг к масштабируемым квантовым вычислениям. Однако для одного качественного логического кубита могут понадобиться сотни или тысячи физических, а полезные алгоритмы могут потребовать тысячи логических кубитов. Пока такой масштаб недостижим, исследователи используют методы смягчения ошибок, чтобы уменьшать шум в небольших устройствах. Это повышает надёжность моделирования химических процессов и оптимизационных испытаний, хотя не обеспечивает полноценной коррекции. Дальнейшая работа сосредоточена на более быстрых и точных двухкубитных операциях, улучшенных измерениях и модульных архитектурах, соединяющих небольшие процессоры фотонными каналами. С развитием управляющей электроники и криогенной техники путь к отказоустойчивости становится яснее. Цель — не просто более крупная машина, а компьютер, который сохраняет достоверность ответов достаточно долго для решения реальных задач."}, "vocab": [["fragile", "delicate / vulnerable", "нәзік", "хрупкий"], ["decoherence", "loss of quantum coherence", "декогеренция", "декогеренция"], ["threshold", "limit / boundary", "шекті деңгей", "порог"], ["mitigation", "reduction / alleviation", "азайту", "смягчение"], ["scalable", "expandable / able to grow", "ауқымдалатын", "масштабируемый"], ["trustworthy", "reliable / dependable", "сенімді", "надёжный"]], "paraphrases": [["Qubits lose their delicate quantum state through noise.", "Noise can destroy the fragile state of a qubit."], ["Error correction protects information.", "Error-correcting methods help preserve quantum information."], ["Larger codes can outperform smaller ones.", "Increasing code size may improve logical-qubit performance."], ["Useful algorithms may need thousands of logical qubits.", "Practical computations could require many thousands of encoded qubits."], ["The roadmap focuses on faster, cleaner two-qubit gates.", "Researchers aim to improve the speed and accuracy of two-qubit operations."]]}];let lang='kk',modes={};const T={kk:{heading:'Reading 2 · Тақырыптық мәтіндер',sub:'Түпнұсқа мәтін · 8 сұрақ · толық аударма · түсіндірме · синонимдер · парафраздар',topic:'Ғылыми жұмыс, жаңалықтар және ғылым қайраткерлері',test:'Тест',translation:'Толық аударма',synonyms:'Синонимдер',paraphrases:'Парафраздар',mode:'Тапсырма режимі',quiz:'Quiz',exam:'Test',help:'Quiz: әр жауаптан кейін түсіндірме шығады.',examhelp:'Test: барлық жауапты белгілеп, нәтижені тексеріңіз.',check:'Нәтижені тексеру',correct:'Дұрыс жауап',score:'Нәтиже',notanswered:'Жауап берілмеген'},ru:{heading:'Reading 2 · Тематические тексты',sub:'Оригинальный текст · 8 вопросов · полный перевод · объяснения · синонимы · парафразы',topic:'Научная работа, открытия, деятели науки и общества',test:'Тест',translation:'Полный перевод',synonyms:'Синонимы',paraphrases:'Парафразы',mode:'Режим заданий',quiz:'Quiz',exam:'Test',help:'Quiz: объяснение появляется после каждого ответа.',examhelp:'Test: ответьте на все вопросы и проверьте результат.',check:'Проверить результат',correct:'Правильный ответ',score:'Результат',notanswered:'Нет ответа'}};const answers={};function setLang(l){lang=l;document.documentElement.lang=l;document.getElementById('kk').classList.toggle('active',l==='kk');document.getElementById('ru').classList.toggle('active',l==='ru');render()}function switchTab(i,t){document.querySelectorAll('#lesson'+i+' .tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelectorAll('#lesson'+i+' .panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===t))}function setMode(i,m){modes[i]=m;render();}function choose(i,q,a){answers[i]??={};answers[i][q]=a;const mode=modes[i]||'quiz';if(mode==='quiz'){const box=document.getElementById('feedback-'+i+'-'+q);box.innerHTML=feedback(i,q,a);box.hidden=false;} }function feedback(i,q,a){const x=DATA[i].questions[q],ok=a===x[2];return '<div class="explain '+(ok?'':'wrong')+'"><b>'+(ok?'✓':'✕')+' '+T[lang].correct+': '+String.fromCharCode(65+x[2])+') '+escapeHtml(x[1][x[2]])+'</b><div>'+escapeHtml(x[lang==='kk'?4:5])+'</div></div>'}function check(i){let score=0;DATA[i].questions.forEach((q,j)=>{if(answers[i]?.[j]===q[2])score++;const box=document.getElementById('feedback-'+i+'-'+j);box.innerHTML=answers[i]?.[j]===undefined?'<div class="explain wrong">'+T[lang].notanswered+'. '+T[lang].correct+': '+String.fromCharCode(65+q[2])+') '+escapeHtml(q[1][q[2]])+'<div>'+escapeHtml(q[lang==='kk'?4:5])+'</div></div>':feedback(i,j,answers[i][j]);box.hidden=false});document.getElementById('result-'+i).textContent=T[lang].score+': '+score+'/8'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const t=T[lang];document.getElementById('heading').textContent=t.heading;document.getElementById('subtitle').textContent=t.sub;document.getElementById('lessons').innerHTML=DATA.map((d,i)=>{const mode=modes[i]||'quiz';return '<section class="lesson" id="lesson'+i+'"><div class="num">READING '+String(i+1).padStart(2,'0')+' · '+d.level+'</div><h2>'+escapeHtml(d.title)+'</h2><p class="topic">'+t.topic+'</p><div class="original">'+escapeHtml(d.text)+'</div><div class="tabs">'+[['test',t.test],['translation',t.translation],['synonyms',t.synonyms],['paraphrases',t.paraphrases]].map(([id,name],j)=>'<button data-tab="'+id+'" class="'+(!j?'active':'')+'" onclick="switchTab('+i+',\''+id+'\')">'+name+'</button>').join('')+'</div><div class="panel active" data-panel="test"><b>'+t.mode+'</b><div class="mode"><button class="'+(mode==='quiz'?'active':'')+'" onclick="setMode('+i+',\'quiz\')">Quiz</button><button class="'+(mode==='test'?'active':'')+'" onclick="setMode('+i+',\'test\')">Test</button></div><p class="muted">'+(mode==='quiz'?t.help:t.examhelp)+'</p>'+d.questions.map((q,j)=>'<div class="question"><h3>'+(j+1)+'. '+escapeHtml(q[0])+'</h3>'+q[1].map((a,k)=>'<label class="choice"><input type="radio" name="q'+i+'_'+j+'" '+(answers[i]?.[j]===k?'checked':'')+' onchange="choose('+i+','+j+','+k+')"><span>'+String.fromCharCode(65+k)+') '+escapeHtml(a)+'</span></label>').join('')+'<div id="feedback-'+i+'-'+j+'" hidden></div></div>').join('')+'<button class="check" onclick="check('+i+')">'+t.check+'</button><div class="result" id="result-'+i+'"></div></div><div class="panel" data-panel="translation"><div class="translation">'+escapeHtml(d.translation[lang])+'</div></div><div class="panel" data-panel="synonyms"><div class="smallcards">'+d.vocab.map(v=>'<div class="smallcard"><strong>'+escapeHtml(v[0])+'</strong><div>'+escapeHtml(v[1])+'</div><em>'+escapeHtml(v[lang==='kk'?2:3])+'</em></div>').join('')+'</div></div><div class="panel" data-panel="paraphrases"><div class="smallcards">'+d.paraphrases.map(p=>'<div class="smallcard"><strong>'+escapeHtml(p[0])+'</strong><div>→ '+escapeHtml(p[1])+'</div></div>').join('')+'</div></div></section>'}).join('')}</script></body></html>
